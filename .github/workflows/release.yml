# Release vcf-cf-migrator: a vX.Y.Z tag push is the release (rule 13).
#
# Placement (github-ci skill): needs no lab, no Docker daemon, so
# GitHub-hosted runners; free on this public repo. The three-OS PyInstaller
# matrix is the reason this is not a lab job at all: a Windows binary has to
# be built on Windows and a macOS binary on macOS.
#
# Order, each job a gate for the next: refuse a bad tag and run the suite;
# build one binary per OS (two for macOS) and smoke it (version, inspect on a generated
# fixture) from a directory holding nothing but the binary; then build the
# wheel and publish the GitHub Release, idempotently per tag.

name: Release

on:
  push:
    tags:
      # Strict three-component semver only.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read   # the publish job alone gets write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Releases are cut only from the upstream repo, never a clone.
    if: github.repository == 'sentania-labs/vcf-cf-migrator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The on.push.tags glob already admits only v<digits>.<digits>.<digits>;
      # the ancestor check below is the real gate.
      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not reachable from main; refusing to release"
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install and run the suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest -q
          # The version baked into the install must be the tag's.
          want="${GITHUB_REF_NAME#v}"
          got="$(python -c 'import vcfcf_migrator; print(vcfcf_migrator.__version__)')"
          [ "$got" = "$want" ] || { echo "::error::installed version $got does not match tag $want"; exit 1; }

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          # macos-latest is Apple Silicon; macos-15-intel is the current Intel image
          # (macos-13 is retired and an unknown label queues silently).
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            name: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build the one-file binary
        shell: bash
        run: |
          # copy-metadata: without it the binary has no dist-info and both
          # version strings read 0.0.0.
          # PyInstaller bundles only what is imported statically from
          # vcfcf_migrator, so a core module reached by a late import is
          # absent from the binary and the command that needs it fails only
          # when a user runs it. Keep every core import static (or add
          # --hidden-import), and keep the smoke below running every
          # subcommand the binary claims, which is what would catch it.
          python -m PyInstaller --onefile --clean --noconfirm \
            --name "vcfcf-migrator-${{ matrix.name }}" \
            --copy-metadata vcf-cf-migrator --copy-metadata vcf-cf-tooling-core \
            src/vcfcf_migrator/__main__.py
          ls -l dist/

      - name: Smoke the binary from a directory holding nothing else
        shell: bash
        # Every subcommand, because a PyInstaller build can be missing exactly
        # the core module one command needs and no other. The expected counts
        # come from the fixture module, never from a number typed here.
        run: |
          checks="$PWD/tests/fixtures/ci_checks.py"
          ok="$(python "$checks" floor)"
          python tests/fixtures/make_export_fixture.py "$RUNNER_TEMP/fixture.zip"
          mkdir -p "$RUNNER_TEMP/smoke"
          cp "dist/vcfcf-migrator-${{ matrix.name }}${{ matrix.ext }}" "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          bin="./vcfcf-migrator-${{ matrix.name }}${{ matrix.ext }}"
          "$bin" version
          "$bin" inspect "$RUNNER_TEMP/fixture.zip"
          "$bin" inspect --json "$RUNNER_TEMP/fixture.zip" > inspect.json
          python "$checks" listing inspect.json
          "$bin" --source-version "$ok" tree "$RUNNER_TEMP/fixture.zip"
          "$bin" --source-version "$ok" build "$RUNNER_TEMP/fixture.zip" --select-all --out bundle.zip
          "$bin" inspect --json bundle.zip > bundle.json
          python "$checks" listing bundle.json --bundle
          mkdir -p empty-corpus
          "$bin" corpus-check empty-corpus
          # The binary must report the tag's version, not a dev version.
          "$bin" version | grep -F "vcfcf-migrator ${GITHUB_REF_NAME#v}"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vcfcf-migrator-${{ matrix.name }}
          path: dist/vcfcf-migrator-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create / upload
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -l dist/

      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: binaries
          merge-multiple: true

      - name: Publish GitHub Release (idempotent per tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x binaries/vcfcf-migrator-linux binaries/vcfcf-migrator-macos-arm64 binaries/vcfcf-migrator-macos-x86_64
          ls -l binaries/
          TAG="$GITHUB_REF_NAME"
          ASSETS="dist/*.whl binaries/vcfcf-migrator-linux binaries/vcfcf-migrator-macos-arm64 binaries/vcfcf-migrator-macos-x86_64 binaries/vcfcf-migrator-windows.exe"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $ASSETS \
              --repo "$GITHUB_REPOSITORY" \
              --title "vcf-cf-migrator $TAG" \
              --notes "Binaries for Linux, macOS (arm64 and x86_64) and Windows plus the Python wheel. Install: download the binary for your OS, or pip install the wheel URL. See README.md."
          fi
