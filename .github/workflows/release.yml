# Release vcf-cf-migrator: a vX.Y.Z tag push is the release (rule 13).
#
# Placement (github-ci skill): needs no lab, no Docker daemon, so
# GitHub-hosted runners; free on this public repo. The three-OS PyInstaller
# matrix is the reason this is not a lab job at all: a Windows binary has to
# be built on Windows and a macOS binary on macOS.
#
# Order, each job a gate for the next: refuse a bad tag and run the suite;
# build each platform download and smoke it (subcommands on a
# generated fixture, including the refusal of a build with a missing
# dependency), from a directory holding nothing but the binary on Linux and
# Windows and through the app bundle's launcher on macOS; then build the
# wheel and publish the GitHub Release, idempotently per tag.
#
# Signing and notarization are the org's shared actions in sentania-labs/.github
# (pinned by commit below); the Developer ID and notary credentials are org
# secrets scoped to this repository. The repo-level copies from 2026-09-15
# were deleted on 2026-09-30 (a repo secret would silently override the org
# one), so rotating the org secrets is the only rotation there is.
# The notary diagnostics workflow lives there too (Actions tab of that repo).
#
# One consequence of the macOS signing steps is worth stating plainly: the
# release now depends on Apple. If the notary service is down or slow, the
# macOS leg fails, the binaries job fails, and publish is skipped, so nothing
# ships at all, not even Linux. That is deliberate. The alternative is
# publishing an unsigned macOS app that no one can run, which is the exact
# problem these steps exist to fix, and a half-published release is worse than
# a late one. Recovery is one command against the same tag:
#
#     gh run rerun <run-id> --failed
#
# The publish step is idempotent per tag, so a rerun re-uses the tag rather
# than needing a new one.

name: Release

on:
  push:
    tags:
      # Strict three-component semver only.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read   # the publish job alone gets write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Releases are cut only from the upstream repo, never a clone.
    if: github.repository == 'sentania-labs/vcf-cf-migrator'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The on.push.tags glob already admits only v<digits>.<digits>.<digits>;
      # the ancestor check below is the real gate.
      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not reachable from main; refusing to release"
            exit 1
          fi

      # Before anything is built. A missing signing secret is fatal to the
      # release either way, and finding that out here costs seconds, where
      # finding it out in the notarize step costs the whole matrix first.
      # The secrets are sentania-labs org secrets (selected repositories);
      # the shared action tests them without printing them.
      - name: Refuse to start without every signing secret
        uses: sentania-labs/.github/.github/actions/signing-secrets-present@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # sentania-labs/.github main 2026-10-07
        with:
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Refuse to start without Windows signing secrets
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          missing=0
          for name in ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install and run the suite
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/release-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r packaging/release-requirements.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pytest -q
          # The version baked into the install must be the tag's.
          want="${GITHUB_REF_NAME#v}"
          got="$(python -c 'import vcfcf_migrator; print(vcfcf_migrator.__version__)')"
          [ "$got" = "$want" ] || { echo "::error::installed version $got does not match tag $want"; exit 1; }

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          # macos-latest is Apple Silicon; macos-15-intel is the current Intel image
          # (macos-13 is retired and an unknown label queues silently).
          - os: macos-latest
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            name: macos-x86_64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/release-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r packaging/release-requirements.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Install native Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          mapfile -t runtime_packages < packaging/linux-runtime.txt
          sudo apt-get install -y xvfb xdotool "${runtime_packages[@]}"

      - name: Exercise the native Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/smoke_native.py

      - name: Build the one-file binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          # copy-metadata: without it the binary has no dist-info and both
          # version strings read 0.0.0.
          # PyInstaller bundles only what is imported statically from
          # vcfcf_migrator, so a core module reached by a late import is
          # absent from the binary and the command that needs it fails only
          # when a user runs it. Keep every core import static (or add
          # --hidden-import), and keep the smoke below running every
          # subcommand the binary claims, which is what would catch it.
          # pywebview picks its platform backend at runtime, which PyInstaller
          # cannot see by following imports, so without --collect-all the
          # binary can build successfully while losing its native backend.
          # The smoke step below catches that before publication.
          extra="--collect-all webview"
          if [ "$RUNNER_OS" = "Linux" ]; then
            extra="$extra --hidden-import PySide6.QtWebEngineCore --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebChannel"
          fi
          # shellcheck disable=SC2086
          python -m PyInstaller --onefile --clean --noconfirm \
            --name "vcfcf-migrator" \
            --copy-metadata vcf-cf-migrator --copy-metadata vcf-cf-tooling-core \
            $extra \
            src/vcfcf_migrator/__main__.py
          ls -l dist/

      - name: Build the Mac application
        if: runner.os == 'macOS'
        run: python packaging/build_macos.py

      - name: Sign the Windows executable
        if: runner.os == 'Windows'
        uses: sentania-labs/.github/.github/actions/windows-sign@899421db1380620b2d4e2d8ac8b6acf16fe15b99 # windows-sign fix merged on main
        with:
          files: ${{ github.workspace }}\dist\vcfcf-migrator.exe
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify Authenticode signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/vcfcf-migrator.exe'
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }

      # ---- macOS signing and notarization -------------------------------
      # The org's shared actions (sentania-labs/.github) do the work; their
      # comments carry the why (hardened runtime, timestamp, strict verify,
      # team check, stapling the app bundle, Apple's round trip).
      # Order matters: sign, then the smoke below runs the SIGNED app's launcher,
      # then notarize, so a signature that breaks startup is caught in
      # seconds rather than after Apple's round trip.
      # The CLI wrapper is a shell script, so the shared action's Mach-O
      # discovery cannot find it. Sign it by path before sealing the app.
      # The notarization action uses ditto, preserving its signature xattrs.
      - name: Sign the Mac CLI wrapper
        if: runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-sign@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # main 2026-10-07
        with:
          binary: dist/VCF Content Migrator.app/Contents/MacOS/vcfcf-migrator
          entitlements: packaging/macos-entitlements.plist
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}

      - name: Sign the Mac application
        if: runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-sign@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # main 2026-10-07
        with:
          bundle: dist/VCF Content Migrator.app
          entitlements: packaging/macos-entitlements.plist
          macos-cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          macos-cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          macos-team-id: ${{ secrets.MACOS_TEAM_ID }}

      - name: Exercise the packaged Mac window
        if: runner.os == 'macOS'
        run: |
          python tools/smoke_macos_app.py 'dist/VCF Content Migrator.app'
          python tools/smoke_macos_app.py 'dist/VCF Content Migrator.app' --launcher --objects 9000 --identities 113 --screenshot macos-app-large.png

      - name: Smoke the binary from a directory holding nothing else
        shell: bash
        # Every subcommand, because a PyInstaller build can be missing exactly
        # the core module one command needs and no other. The expected counts
        # come from the fixture module, never from a number typed here.
        run: |
          checks="$PWD/tests/fixtures/ci_checks.py"
          python tests/fixtures/make_export_fixture.py "$RUNNER_TEMP/fixture.zip"
          mkdir -p "$RUNNER_TEMP/smoke"
          if [ "$RUNNER_OS" = "macOS" ]; then
            bin="$PWD/dist/VCF Content Migrator.app/Contents/MacOS/vcfcf-migrator"
          else
            cp "dist/vcfcf-migrator${{ matrix.ext }}" "$RUNNER_TEMP/smoke/"
            bin="$RUNNER_TEMP/smoke/vcfcf-migrator${{ matrix.ext }}"
          fi
          cd "$RUNNER_TEMP/smoke"
          "$bin" version
          "$bin" inspect "$RUNNER_TEMP/fixture.zip"
          "$bin" inspect --json "$RUNNER_TEMP/fixture.zip" > inspect.json
          python "$checks" listing inspect.json
          "$bin" tree "$RUNNER_TEMP/fixture.zip"
          "$bin" preview "$RUNNER_TEMP/fixture.zip" "$(python "$checks" preview-object)" --out preview.html
          python "$checks" preview preview.html
          # The fixture's select-all depends on content the fixture leaves
          # out on purpose, so build refuses it (#31): no override, no file.
          # The bundle smoked here is the fixture's clean selection, whose
          # lines come from the fixture module, never from here.
          python "$checks" clean-selection > picks.txt
          "$bin" build "$RUNNER_TEMP/fixture.zip" --select picks.txt --out bundle.zip
          "$bin" inspect --json bundle.zip > bundle.json
          python "$checks" listing bundle.json --bundle
          # And the refusal, on the shipped binary: a non-zero exit, no file,
          # and every missing dependency in the log.
          if "$bin" --log refused.jsonl build "$RUNNER_TEMP/fixture.zip" --select-all --out refused.zip; then
            echo "::error::the binary wrote a bundle for a selection with missing dependencies"
            exit 1
          fi
          if [ -e refused.zip ]; then
            echo "::error::a refused build left refused.zip behind"
            exit 1
          fi
          python "$checks" refusal refused.jsonl
          "$bin" log-render refused.jsonl > rendered.log
          test -s rendered.log
          if "$bin" inspect missing.zip > /dev/null 2> error.log; then
            echo "::error::inspect accepted a missing file"
            exit 1
          fi
          test -s error.log
          mkdir -p empty-corpus
          "$bin" corpus-check empty-corpus
          # The binary must report the tag's version, not a dev version.
          "$bin" version | grep -F "vcfcf-migrator ${GITHUB_REF_NAME#v}"
          # Every platform must retain its native window backend in the binary.
          "$bin" version
          "$bin" version | grep -F "native window: available" || {
            echo "::error::this build lost the native window backend"
            exit 1
          }

      - name: Exercise the packaged Linux window
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python tools/smoke_frozen_linux.py dist/vcfcf-migrator

      - name: Notarize and staple the Mac application
        if: runner.os == 'macOS'
        uses: sentania-labs/.github/.github/actions/macos-notarize@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # main 2026-10-07
        with:
          bundle: dist/VCF Content Migrator.app
          output-zip: dist/vcfcf-migrator-${{ matrix.name }}-app.zip
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-key-p8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Assess the stapled Mac application
        if: runner.os == 'macOS'
        run: |
          python tools/smoke_macos_app.py 'dist/VCF Content Migrator.app' --assess-only
          # Script signatures live in xattrs. Verify the actual download also
          # retains them after the notarization action archives the app.
          unpacked="$RUNNER_TEMP/signed-download"
          ditto -x -k "dist/vcfcf-migrator-${{ matrix.name }}-app.zip" "$unpacked"
          codesign --verify --deep --strict --verbose=2 "$unpacked/VCF Content Migrator.app"

      - name: Package the executable
        if: runner.os != 'macOS'
        shell: bash
        run: python packaging/archive.py "dist/vcfcf-migrator${{ matrix.ext }}" "${{ matrix.name }}"

      - name: Include the stapled Mac application archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p archives
          cp "dist/vcfcf-migrator-${{ matrix.name }}-app.zip" archives/

      - name: Clean up signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/signing.keychain-db}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      - name: Upload the archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vcfcf-migrator-${{ matrix.name }}
          path: archives/*
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create / upload
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/release-bootstrap.txt
          python -m pip install --require-hashes --no-build-isolation -r packaging/release-requirements.txt
          python -m build --wheel --no-isolation
          ls -l dist/

      - name: Download the binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: binaries
          merge-multiple: true

      - name: Hash the release assets
        run: |
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          paths = sorted([*Path("dist").glob("*.whl"), *Path("binaries").glob("*.zip"), *Path("binaries").glob("*.tar.gz")])
          if len(paths) != 5:
              raise SystemExit(f"Expected one wheel and four archives, found {len(paths)}")
          Path("SHA256SUMS").write_text("".join(f"{hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()}  {p.name}\n" for p in paths))
          PYCODE

      - name: Attest the release assets
        uses: sentania-labs/.github/.github/actions/attest-provenance@a37e4e029c8ebb8f1810c3dd50aa035acecbe1fc # sentania-labs/.github main 2026-10-07
        with:
          subject-path: |
            SHA256SUMS
            dist/*.whl
            binaries/*.zip
            binaries/*.tar.gz

      - name: Publish GitHub Release (idempotent per tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l binaries/
          TAG="$GITHUB_REF_NAME"
          ASSETS="SHA256SUMS dist/*.whl binaries/*.zip binaries/*.tar.gz"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" $ASSETS --clobber --repo "$GITHUB_REPOSITORY"
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $ASSETS \
              --repo "$GITHUB_REPOSITORY" \
              --title "vcf-cf-migrator $TAG" \
              --notes-file packaging/release-notes.md
          fi
